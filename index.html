<!DOCTYPE html>

<head>

<body>
    <div class="max-w-md mx-auto rounded-md bg-slate-50 overflow-hidden mt-10 border">

            <h1 class="font-serif text-lg font-semibold">ToDo App</h1>
        </div>

            <form id="todo-form" action="" class="flex gap-7">

                <button id="form-btn" class="bg-indigo-400 rounded-md px-4 text-white font-serif">Add</button>
            </form>
            <div class="flex justify-between pt-6 pb-1 text-xs border-b border-black">
                <p>Tasks <span></span></p>
                <p>Completed : 1</p>
            </div>
            <ul id="todo-list" class="py-4 flex gap-3 flex-col">

                    </div>
                </li> -->
